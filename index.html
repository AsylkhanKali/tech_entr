<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Travel Planner · Astana</title>
<style>
:root{color-scheme:light;--ink:#153d34;--paper:#f6f4ea;--gold:#dcac48;--line:#c9cbbd;--muted:#4b6359;--white:#fffef7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Helvetica Neue",Arial,sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:0 36px}header{height:75px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9a6313;outline-offset:3px}.brand{font-weight:720;letter-spacing:-.04em;font-size:21px;display:flex;gap:9px;align-items:center}.mark{width:24px;height:26px;background:var(--ink);clip-path:polygon(0 100%,48% 0,100% 100%,61% 81%,48% 42%,35% 81%)}.langs{display:flex;padding:3px;background:#e8e8dc;border-radius:6px}.langs button{border:0;border-radius:4px;padding:5px 11px;background:transparent;font-size:14px}.langs [aria-pressed=true]{background:var(--ink);color:white}.intro{padding:32px 0 28px}.loc{color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.intro h1{font:normal clamp(36px,5vw,65px)/1.03 Georgia,serif;letter-spacing:-.045em;margin:8px 0 9px}.intro p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(285px,0.88fr) minmax(350px,1.14fr);gap:32px;align-items:start}.settings,.sheet{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:22px 24px}.sheet{padding:0;overflow:hidden}.sheet-top{background:var(--ink);color:var(--white);padding:17px 24px;display:flex;align-items:center;justify-content:space-between}.sheet-top span{color:#f1dcae;font-size:14px}.sheet-inner{padding:18px 24px}h2,h3{margin:0;letter-spacing:-.025em}h2{font-size:23px}h3{font-size:17px}.fields{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px;margin:15px 0 20px}.fields label,.field{display:grid;font-size:13px;font-weight:650;gap:3px}.fields input,select,textarea{width:100%;min-width:0;border:1px solid #9ba99c;border-radius:5px;background:white;padding:6px}.places{display:grid;gap:1px;margin:6px 0 13px}.place{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #e1e1d6;cursor:pointer}.place input{width:18px;height:18px;accent-color:var(--ink)}.place small{display:block;color:var(--muted);font-size:12px}.place b{font-size:15px}.hint,.meta{color:var(--muted);font-size:13px;margin:3px 0 7px}.primary,.action{border-radius:5px;padding:9px 14px;font-weight:650}.primary{background:var(--ink);color:white;border:1px solid var(--ink);width:100%}.action{background:transparent;border:1px solid #a7b3a8;font-size:13px}.error,.warn{color:#763618;background:#faecd8;border-left:3px solid #b36626;padding:8px 10px;font-size:14px}.error:empty{display:none}.empty{padding:20px 0 28px}.empty p{margin:5px 0}.summary{display:flex;flex-wrap:wrap;gap:8px 18px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:14px}.stop{display:grid;grid-template-columns:60px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid #ddddcf}.stop time{font-variant-numeric:tabular-nums;font-weight:bold}.stop p{margin:3px 0}.remove{border:0;background:transparent;text-decoration:underline;padding:3px 0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;margin:13px 0}.notice{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin:12px 0 0;padding-top:12px}details{margin:22px 0 32px;max-width:600px}summary{cursor:pointer;font-weight:650}.feedback{display:grid;gap:10px;margin:12px 0}.feedback .action{justify-self:start}footer{font-size:13px;color:var(--muted);padding-bottom:24px}#live{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
@media(max-width:740px){header,main,footer{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr;gap:16px}header{height:58px}.settings{padding:18px}.intro{padding:22px 0}.fields{grid-template-columns:1.28fr 1fr .95fr}.sheet-top,.sheet-inner{padding-left:18px;padding-right:18px}}
@media print{header,.intro,.settings,details,footer,.tools,.remove,#live{display:none}body,.sheet-top{background:white;color:black}.sheet-top span{color:black}.grid{display:block}.sheet{border:0}.stop{break-inside:avoid}main{padding:0}}
</style></head>
<body><header><div class="brand"><span class="mark"></span>AI Travel Planner</div><div class="langs"><button id="en" lang="en">EN</button><button id="kk" lang="kk">Қазақша</button></div></header>
<main><div class="intro"><div class="loc" data-t="loc"></div><h1 data-t="title"></h1><p data-t="intro"></p></div><div class="grid"><form id="settings" class="settings" novalidate><h2 data-t="setup"></h2><div class="fields"><label><span data-t="date"></span><input id="date" type="date" required></label><label><span data-t="start"></span><select id="start"></select></label><label><span data-t="length"></span><select id="length"></select></label></div><h3 data-t="places"></h3><p class="hint" data-t="choose"></p><div id="places" class="places"></div><p id="error" class="error" role="alert"></p><button class="primary" id="build" data-t="build"></button></form>
<section class="sheet" aria-labelledby="planhead"><div class="sheet-top"><h2 data-t="plan" id="planhead"></h2><span id="daylabel"></span></div><div class="sheet-inner"><div id="result"></div><p class="notice" data-t="notice"></p></div></section></div><details><summary data-t="feedback"></summary><form class="feedback" id="feedback"><label class="field"><span data-t="rating"></span><select id="rating" required><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label class="field"><span data-t="note"></span><textarea id="note" rows="2" maxlength="400"></textarea></label><span class="hint" data-t="privacy"></span><button type="submit" class="action" data-t="save"></button><button type="button" class="action" id="clear" data-t="clear"></button><span id="saved" role="status"></span></form></details></main><footer data-t="foot"></footer><div id="live" role="status"></div>
<script>
const copy={
en:{loc:'Kazakhstan / Astana',title:'Plan a day in Astana',intro:'Choose your stops and see what fits before you head out.',setup:'Your day',date:'Date',start:'Start time',length:'Time available',places:'Places to visit',choose:'Choose 2–4 places in the order you want to visit.',build:'Build my day',plan:'Day itinerary',notice:'Practice data. Hours, visit lengths and entry costs are illustrative. Allow 30 minutes between stops. Check venue details and transport before travelling.',feedback:'Rate this planner',rating:'Usefulness (1 = low, 5 = high)',note:'Optional note',privacy:'Saved on this browser only. Leave out names and contact details.',save:'Save feedback',clear:'Delete saved feedback',foot:'Astana city-day planner · Single-day practice edition',hour:'h',min:'min',empty:'Your itinerary starts here',emptyBody:'Select your places, then build your day to see visit times and any conflicts.',minErr:'Choose at least two places to build a day.',maxErr:'Four places are already selected. Remove one to add another.',dateErr:'Choose a valid date.',window:'Day window',entry:'Entry per person',end:'Finish',wait:'Wait before opening',transfer:'Transfer allowance',closes:'Visit ends after the sample closing time',over:'Past your day end by',fit:'All stops fit the sample schedule.',issues:'Stops with a time conflict',remove:'Remove',reverse:'Reverse order',print:'Print itinerary',removed:'Choose another place to rebuild your day.',saved:'Feedback saved on this browser.',cleared:'Saved feedback deleted.',storage:'Browser storage is unavailable.',rated:'Choose a rating first.',changed:'Selections changed. Build your day to update the itinerary.'},
kk:{loc:'Қазақстан / Астана',title:'Астанадағы бір күнді жоспарлаңыз',intro:'Жолға шықпас бұрын баратын жерлеріңізді таңдап, уақыттың жететінін тексеріңіз.',setup:'Күн жоспары',date:'Күні',start:'Басталуы',length:'Бос уақыт',places:'Баратын жерлер',choose:'Барғыңыз келетін 2–4 жерді сапар ретімен таңдаңыз.',build:'Жоспар құру',plan:'Күндік бағдар',notice:'Оқу үлгісі. Жұмыс уақыты, сапар ұзақтығы мен кіру ақысы мысал ретінде берілген. Нысандар арасында жолға 30 минут бөлінеді. Сапар алдында жұмыс уақытын және көлік бағытын тексеріңіз.',feedback:'Жоспарлаушыны бағалау',rating:'Пайдалылығы (1 = төмен, 5 = жоғары)',note:'Пікір (міндетті емес)',privacy:'Тек осы браузерде сақталады. Аты-жөніңізді және байланыс деректерін жазбаңыз.',save:'Пікірді сақтау',clear:'Сақталған пікірді өшіру',foot:'Астанадағы бір күн · Оқу үлгісі',hour:'сағ',min:'мин',empty:'Бағдарыңыз осы жерден басталады',emptyBody:'Баратын жерлерді таңдап, жоспар құрыңыз. Сапар уақытын және уақыт қайшылығын осы жерден көресіз.',minErr:'Жоспар құру үшін кемінде екі жерді таңдаңыз.',maxErr:'Төрт жер таңдалды. Басқасын қосу үшін біреуін алып тастаңыз.',dateErr:'Жарамды күнді таңдаңыз.',window:'Сапар уақыты',entry:'Бір адамға кіру ақысы',end:'Аяқталуы',wait:'Ашылғанша күту',transfer:'Жолға бөлінген уақыт',closes:'Сапар нысанның үлгідегі жабылу уақытынан кейін аяқталады',over:'Бөлінген уақыттан асып кетуі',fit:'Барлық сапар үлгідегі уақытқа сыяды.',issues:'Уақыт қайшылығы бар нысандар саны',remove:'Алып тастау',reverse:'Ретін кері өзгерту',print:'Бағдарды басып шығару',removed:'Жоспарды қайта құру үшін тағы бір жерді таңдаңыз.',saved:'Пікір осы браузерде сақталды.',cleared:'Сақталған пікір өшірілді.',storage:'Браузерге сақтау мүмкін емес.',rated:'Алдымен баға беріңіз.',changed:'Таңдау өзгерді. Бағдарды жаңарту үшін жоспарды қайта құрыңыз.'}};
const places=[
{en:'Bayterek',kk:'Бәйтерек',open:600,close:1080,visit:45,cost:1500},
{en:'National Museum',kk:'Ұлттық музей',open:600,close:1020,visit:75,cost:2000},
{en:'Khan Shatyr',kk:'Хан Шатыр',open:600,close:1260,visit:45,cost:0},
{en:'Palace of Peace and Reconciliation',kk:'Бейбітшілік және келісім сарайы',open:600,close:1020,visit:60,cost:1200},
{en:'Botanical Garden',kk:'Ботаникалық бақ',open:540,close:1140,visit:60,cost:0}];
let lang='en',selected=[],built=false,errorKey='',feedbackKey='',dirty=false;
const el=id=>document.getElementById(id),t=key=>copy[lang][key],clock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),money=n=>new Intl.NumberFormat(lang==='kk'?'kk-KZ':'en-GB').format(n)+' ₸';
const now=new Date();el('date').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
for(let m=480;m<=1080;m+=30)el('start').add(new Option(clock(m),m));el('start').value=600;
for(let n=2;n<=6;n++)el('length').add(new Option(n,n));el('length').value=4;
function invalidate(){dirty=built||dirty;built=false;errorKey='';render()}
function plan(){let cursor=Number(el('start').value),limit=cursor+60*Number(el('length').value);return selected.map((id,i)=>{const p=places[id],arrival=cursor+(i?30:0),start=Math.max(arrival,p.open),end=start+p.visit;cursor=end;return {id,p,start,end,wait:start-arrival,late:Math.max(0,end-limit),closed:end>p.close}})}
function render(){
document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));
for(const l of ['kk','en'])el(l).setAttribute('aria-pressed',l===lang);
for(const o of el('length').options)o.textContent=o.value+' '+t('hour');
el('places').innerHTML=places.map((p,i)=>'<label class="place"><input type="checkbox" id="p'+i+'" data-id="'+i+'" '+(selected.includes(i)?'checked':'')+'><span><b>'+p[lang]+'</b><small>'+clock(p.open)+'–'+clock(p.close)+' · '+p.visit+' '+t('min')+' · '+money(p.cost)+'</small></span></label>').join('');
el('error').textContent=errorKey?t(errorKey):'';el('saved').textContent=feedbackKey?t(feedbackKey):'';
const date=el('date').valueAsDate;el('daylabel').textContent=date?new Intl.DateTimeFormat(lang==='kk'?'kk-KZ':'en-GB',{month:'short',day:'numeric',timeZone:'UTC'}).format(date):'';
if(!built){el('result').innerHTML='<div class="empty"><h3>'+t('empty')+'</h3><p class="meta">'+t(dirty?'changed':'emptyBody')+'</p></div>';return}
const rows=plan(),issues=rows.filter(r=>r.late||r.closed).length,start=Number(el('start').value);
el('result').innerHTML='<div class="summary"><div>'+t('window')+'<br><b>'+clock(start)+'–'+clock(start+60*Number(el('length').value))+'</b></div><div>'+t('entry')+'<br><b>'+money(rows.reduce((s,r)=>s+r.p.cost,0))+'</b></div><div>'+t('end')+'<br><b>'+clock(rows.at(-1).end)+'</b></div></div><p class="'+(issues?'warn':'meta')+'">'+(issues?t('issues')+' · '+issues:t('fit'))+'</p>'+rows.map((r,i)=>'<div class="stop"><time>'+clock(r.start)+'</time><div><h3>'+r.p[lang]+'</h3><p class="meta">'+clock(r.start)+'–'+clock(r.end)+' · '+money(r.p.cost)+'</p>'+(i?'<p class="meta">'+t('transfer')+' · 30 '+t('min')+'</p>':'')+(r.wait?'<p class="meta">'+t('wait')+' · '+r.wait+' '+t('min')+'</p>':'')+(r.closed?'<p class="warn">'+t('closes')+' ('+clock(r.p.close)+').</p>':'')+(r.late?'<p class="warn">'+t('over')+' '+r.late+' '+t('min')+'.</p>':'')+'<button class="remove" data-remove="'+r.id+'" aria-label="'+t('remove')+' '+r.p[lang]+'">'+t('remove')+'</button></div></div>').join('')+'<div class="tools"><button class="action" id="reverse">'+t('reverse')+'</button><button class="action" id="print">'+t('print')+'</button></div>';
}
for(const l of ['en','kk'])el(l).onclick=()=>{lang=l;render()};
el('places').onchange=e=>{const id=Number(e.target.dataset.id);if(e.target.checked&&selected.length===4){errorKey='maxErr';render()}else{selected=e.target.checked?[...selected,id]:selected.filter(x=>x!==id);invalidate()}el('p'+id).focus()};
for(const id of ['date','length','start'])el(id).onchange=invalidate;
el('settings').onsubmit=e=>{e.preventDefault();errorKey=!el('date').valueAsDate?'dateErr':selected.length<2?'minErr':'';built=!errorKey;dirty=false;render();if(built){el('planhead').setAttribute('tabindex','-1');el('planhead').focus();el('live').textContent=t('plan')}};
el('result').onclick=e=>{if(e.target.hasAttribute('data-remove')){selected=selected.filter(x=>x!==Number(e.target.dataset.remove));built=selected.length>=2;errorKey=built?'':'removed';render();(el('result').querySelector('.remove')||el('build')).focus()}else if(e.target.id==='reverse'){selected.reverse();render();el('reverse').focus()}else if(e.target.id==='print'){window.print()}};
const storageKey='astana-planner-feedback';
try{const f=JSON.parse(localStorage.getItem(storageKey));if(f){el('rating').value=String(f.rating);el('note').value=f.note||''}}catch{}
el('feedback').noValidate=true;el('feedback').onsubmit=e=>{e.preventDefault();if(!el('rating').value){feedbackKey='rated'}else{try{localStorage.setItem(storageKey,JSON.stringify({rating:el('rating').value,note:el('note').value}));feedbackKey='saved'}catch{feedbackKey='storage'}}render()};
el('clear').onclick=()=>{try{localStorage.removeItem(storageKey);el('feedback').reset();feedbackKey='cleared'}catch{feedbackKey='storage'}render()};
render();
</script></body></html>
